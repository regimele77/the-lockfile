services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lockfile}
      POSTGRES_USER: ${POSTGRES_USER:-lockfile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lockfile}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lockfile} -d ${POSTGRES_DB:-lockfile}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Tailwind CSS watch, it rebuilds static/css/app.css on template/CSS changes.
  # One-shot production build: docker compose run --rm frontend npm run build
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run watch"
    restart: unless-stopped

  web:
    build: .
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      frontend:
        condition: service_started

  worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      RUN_MIGRATIONS: "0"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  beat:
    build: .
    restart: unless-stopped
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule
    environment:
      RUN_MIGRATIONS: "0"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  frontend_node_modules:

<div class="table-wrap">
  <table class="data-table">
    <thead>
      <tr>
        <th scope="col">Repositories</th>
        <th scope="col">Scans</th>
        <th scope="col">Open findings</th>
        <th scope="col">Open critical</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>{{ repo_count }}</td>
        <td>{{ scan_count }}</td>
        <td>{{ finding_count }}</td>
        <td class="text-critical">{{ open_critical }}</td>
      </tr>
    </tbody>
  </table>
</div>
<p class="mt-2.5 type-caption">Counts cover your tracked repositories and refresh every 30s.</p>

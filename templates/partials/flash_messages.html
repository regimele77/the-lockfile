{% if messages %}
  <div id="flash-messages" class="site-wrap space-y-2 pt-4" role="region" aria-label="Notifications">
    {% for message in messages %}
      <div
        class="{% if message.tags == 'error' %}flash-error{% elif message.tags == 'success' %}flash-success{% elif message.tags == 'warning' %}flash-warning{% else %}flash-info{% endif %}"
        role="status"
      >
        <p>{{ message }}</p>
        <button
          type="button"
          class="shrink-0 text-current opacity-70 hover:opacity-100"
          aria-label="Dismiss"
          onclick="this.closest('[role=status]').remove()"
        >×</button>
      </div>
    {% endfor %}
  </div>
{% endif %}

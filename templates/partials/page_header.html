<div class="page-header">
  <div>
    {% if eyebrow %}
      <p class="mb-1 text-xs text-ink-faint">{{ eyebrow }}</p>
    {% endif %}
    <h1 class="font-display text-2xl text-ink sm:text-3xl">{{ title }}</h1>
    {% if subtitle %}
      <p class="mt-1 text-sm text-ink-muted">{{ subtitle }}</p>
    {% endif %}
  </div>
  {% if action_url and action_label %}
    <a href="{{ action_url }}" class="btn-primary shrink-0">{{ action_label }}</a>
  {% endif %}
</div>

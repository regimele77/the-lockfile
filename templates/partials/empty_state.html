<div class="empty-state">
  {% if icon %}
    <div class="mb-4 text-accent" aria-hidden="true">{{ icon }}</div>
  {% endif %}
  <h2 class="font-display text-xl text-ink">{{ title }}</h2>
  {% if description %}
    <p class="mt-2 text-sm text-ink-muted">{{ description }}</p>
  {% endif %}
  {% if action_url and action_label %}
    <a href="{{ action_url }}" class="btn-primary mt-6">{{ action_label }}</a>
  {% endif %}
</div>

{% load lockfile_tags %}
<header class="site-header">
  <div class="site-wrap">
    <div class="flex items-center gap-4 py-3 lg:gap-8">
      <a href="{% url 'core:landing' %}" class="brand-lockup">
        {% lockfile_mark %}
        <span class="brand-name">The Lockfile</span>
      </a>

      <nav class="site-nav hidden flex-1 items-center gap-0.5 lg:flex" aria-label="Primary">
        <a href="{% url 'core:landing' %}" class="site-nav-link {% nav_active request 'core:landing' %}">Home</a>
        <a href="{% url 'core:landing' %}#what-it-finds" class="site-nav-link">What it finds</a>
        <a href="{% url 'core:landing' %}#why-self-hosted" class="site-nav-link">Why self-hosted</a>
        <a href="{% url 'core:landing' %}#how-it-works" class="site-nav-link">How it works</a>
        <a href="{% url 'core:status' %}" class="site-nav-link {% nav_active request 'core:status' %}">Health</a>
      </nav>

      <div class="ml-auto flex shrink-0 items-center gap-2">
        {% if user.is_authenticated %}
          <a href="{% url 'dashboard:home' %}" class="btn-primary btn-sm">Open dashboard</a>
        {% else %}
          <a href="{% url 'accounts:github' %}" class="btn-primary btn-sm">Connect with GitHub</a>
        {% endif %}
        <button
          type="button"
          class="btn-ghost btn-sm lg:hidden"
          aria-controls="site-nav-mobile"
          aria-expanded="false"
          data-site-nav-toggle
        >Menu</button>
      </div>
    </div>

    <nav
      id="site-nav-mobile"
      class="site-nav -mx-4 hidden flex-col border-t border-line px-4 pb-3 pt-1 lg:hidden"
      aria-label="Primary mobile"
    >
      <a href="{% url 'core:landing' %}" class="site-nav-link {% nav_active request 'core:landing' %}">Home</a>
      <a href="{% url 'core:landing' %}#what-it-finds" class="site-nav-link">What it finds</a>
      <a href="{% url 'core:landing' %}#why-self-hosted" class="site-nav-link">Why self-hosted</a>
      <a href="{% url 'core:landing' %}#how-it-works" class="site-nav-link">How it works</a>
      <a href="{% url 'core:status' %}" class="site-nav-link {% nav_active request 'core:status' %}">Health</a>
    </nav>
  </div>
</header>
<script>
  (function () {
    const toggle = document.querySelector("[data-site-nav-toggle]");
    const nav = document.getElementById("site-nav-mobile");
    if (!toggle || !nav) return;
    toggle.addEventListener("click", function () {
      const open = !nav.classList.contains("hidden");
      nav.classList.toggle("hidden", open);
      nav.classList.toggle("flex", !open);
      toggle.setAttribute("aria-expanded", open ? "false" : "true");
    });
  })();
</script>
